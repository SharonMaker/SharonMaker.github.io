<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sharon万花筒 - 搭配灵感生成器</title>
    <style>
        :root {
            --primary: #d63384;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
            --radius: 16px;
            --shadow: 0 8px 24px rgba(0,0,0,0.08);
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 60px;
            line-height: 1.6;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 24px; color: #333; margin: 0; font-weight: 800; letter-spacing: 1px; }
        .subtitle { font-size: 14px; color: #666; margin-top: 5px; }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease;
        }

        .section-title { 
            font-size: 16px; font-weight: 600; margin-bottom: 15px; 
            border-left: 4px solid var(--primary); padding-left: 10px; 
        }
        
        .gender-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
        .toggle-btn {
            flex: 1; padding: 12px; border: 1px solid #ddd; background: #fff;
            border-radius: var(--radius); font-size: 16px; cursor: pointer; 
            text-align: center;
        }
        .toggle-btn.active { 
            background: var(--primary); color: white; border-color: var(--primary); font-weight: bold; 
        }

        .color-system { 
            margin-bottom: 20px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 15px; 
        }
        .system-name { 
            font-weight: bold; margin-bottom: 10px; display: block; color: #444; 
        }
        
        .color-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
        }

        .color-chip {
            width: 70px !important;
            height: 40px !important;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .color-chip.selected { 
            border-color: #333; 
            transform: scale(0.95); 
            box-shadow: 0 0 0 2px white, 0 0 0 4px #333; 
        }
        .color-chip:hover { 
            transform: scale(1.05); 
            z-index: 2; 
        }

        .tooltip {
            position: absolute; 
            bottom: 100%; 
            left: 50%; 
            transform: translateX(-50%);
            background: #333; 
            color: #fff; 
            padding: 4px 8px; 
            border-radius: 4px;
            font-size: 12px; 
            white-space: nowrap; 
            opacity: 0; 
            pointer-events: none; 
            margin-bottom: 5px;
        }
        .color-chip:hover .tooltip { 
            opacity: 1; 
        }

        .generate-btn {
            width: 100%; 
            padding: 15px; 
            background: #333; 
            color: white;
            border: none; 
            border-radius: var(--radius); 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            margin-top: 10px;
        }
        .generate-btn:active { 
            background: #555; 
        }

        .result-card { 
            border: 1px solid #eee; 
            margin-bottom: 15px; 
        }
        .result-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
        }
        .result-tag { 
            background: #eee; 
            padding: 4px 10px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: bold; 
            color: #555; 
        }
        .scene-tag { 
            font-size: 12px; 
            color: #888; 
            background: #f0f0f0; 
            padding: 2px 6px; 
            border-radius: 4px; 
        }

        .palette-strip { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 15px; 
            overflow-x: auto; 
            padding-bottom: 5px; 
        }
        .palette-item {
            flex: 1; 
            min-width: 60px; 
            text-align: center;
        }
        .palette-color {
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            margin: 0 auto 8px;
            border: 2px solid white; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .palette-label { 
            font-size: 13px; 
            font-weight: 600; 
            color: #333; 
            display: block; 
        }
        .palette-role { 
            font-size: 11px; 
            color: #999; 
        }

        .copy-btn {
            width: 100%; 
            padding: 10px; 
            background: #fff; 
            border: 1px solid var(--primary);
            color: var(--primary); 
            border-radius: 8px; 
            font-size: 14px; 
            cursor: pointer;
            font-weight: 600; 
            transition: 0.2s;
        }
        .copy-btn:hover { 
            background: #fff0f6; 
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @media (max-width: 480px) {
            .app-container { padding: 15px; }
            .color-grid { grid-template-columns: repeat(4, 1fr); }
            .palette-strip { justify-content: flex-start; }
        }

        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            #guide-toast {
                bottom: calc(20px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Sharon万花筒</h1>
        <div class="subtitle">专业色彩搭配灵感生成器</div>
    </header>

    <div class="card">
        <div class="section-title">我是</div>
        <div class="gender-toggle">
            <div class="toggle-btn active" onclick="setGender('male')">男士 (3套方案)</div>
            <div class="toggle-btn" onclick="setGender('female')">女士 (5套方案)</div>
        </div>

        <div class="section-title">我选了衣服颜色 (1-2个)</div>

        <button class="generate-btn" onclick="generateOutfits()">生成专业穿搭灵感 ✨</button>

<!-- 小红书引导浮层 -->
<div id="guide-toast" style="

    z-index: 1000; display: none; max-width: 90%;
    border: 1px solid #f0f0f0;
">
    <div style="display: flex; align-items: center; gap: 12px;">
        <div style="font-size: 24px;">📋</div>
        <div>
            <div style="font-weight: bold; color: #333; margin-bottom: 4px;">文案已复制！</div>
            <div style="font-size: 13px; color: #666;">快去小红书粘贴吧～</div>
        </div>
        <button id="open-xhs-btn" style="
            background: #FF2442; color: white; border: none; border-radius: 8px;
            padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer;
            margin-left: auto;
        ">去小红书</button>
    </div>
</div>

<script>
    // ========== 1. 色彩数据库（含性别标签，安全格式） ==========
    const colorData = {
        "红色系": [
            {"name":"绯红","hex":"#E63946","system":"红色系","gender":"unisex"},
            {"name":"正红","hex":"#EF233C","system":"红色系","gender":"unisex"},
            {"name":"深绯","hex":"#9D0208","system":"红色系","gender":"male"},
            {"name":"浅绯","hex":"#FF8FA3","system":"红色系","gender":"female"},
            {"name":"薄红","hex":"#FFC2D1","system":"红色系","gender":"female"},
            {"name":"浓粉","hex":"#F72585","system":"红色系","gender":"female"},
            {"name":"玫瑰粉","hex":"#B5179E","system":"红色系","gender":"female"},
            {"name":"牡丹红","hex":"#E63946","system":"红色系","gender":"female"}
        ],
        "橙色系": [
            {"name":"橘红","hex":"#F77F00","system":"橙色系","gender":"unisex"},
            {"name":"橙","hex":"#FCBF49","system":"橙色系","gender":"unisex"},
            {"name":"红茶色","hex":"#9D0208","system":"橙色系","gender":"male"},

            {"name":"椰棕","hex":"#7F5539","system":"橙色系","gender":"male"},
            {"name":"沙色","hex":"#EAE2B7","system":"橙色系","gender":"unisex"},
            {"name":"太阳橙","hex":"#FF9F1C","system":"橙色系","gender":"unisex"},
            {"name":"热带橙","hex":"#FF6D00","system":"橙色系","gender":"male"}
        ],
        "黄色系": [
            {"name":"鲜黄","hex":"#FFD60A","system":"黄色系","gender":"female"},
            {"name":"暗黄","hex":"#E09F3E","system":"黄色系","gender":"male"},
            {"name":"茉莉","hex":"#FDFFFC","system":"黄色系","gender":"female"},
            {"name":"香槟","hex":"#FAEDCD","system":"黄色系","gender":"female"},

            {"name":"金盏花","hex":"#D4A574","system":"黄色系","gender":"unisex"},

        ],
        "绿色系": [
            {"name":"嫩绿","hex":"#98F5E0","system":"绿色系","gender":"female"},
            {"name":"春绿","hex":"#2A9D8F","system":"绿色系","gender":"unisex"},
            {"name":"草绿","hex":"#588157","system":"绿色系","gender":"male"},
            {"name":"浓绿","hex":"#264653","system":"绿色系","gender":"male"},
            {"name":"孔雀绿","hex":"#006D5B","system":"绿色系","gender":"unisex"},
            {"name":"森林绿","hex":"#1B4332","system":"绿色系","gender":"male"},
            {"name":"薄荷","hex":"#B7E4C7","system":"绿色系","gender":"female"},
            {"name":"橄榄","hex":"#708238","system":"绿色系","gender":"male"}
        ],
        "青色系": [
            {"name":"天青","hex":"#8ECAE6","system":"青色系","gender":"female"},
            {"name":"浅葱","hex":"#A7C7E7","system":"青色系","gender":"female"},
            {"name":"萨克斯蓝","hex":"#457B9D","system":"青色系","gender":"unisex"},
            {"name":"深蓝","hex":"#1D3557","system":"青色系","gender":"male"},
            {"name":"孔雀蓝","hex":"#0077B6","system":"青色系","gender":"unisex"},
            {"name":"尼罗蓝","hex":"#00B4D8","system":"青色系","gender":"unisex"},
            {"name":"水色","hex":"#90E0EF","system":"青色系","gender":"female"},
            {"name":"灰瓷","hex":"#CAF0F8","system":"青色系","gender":"female"}
        ],
        "紫色系": [
            {"name":"薰衣草","hex":"#E0B1CB","system":"紫色系","gender":"female"},
            {"name":"紫藤","hex":"#C77DFF","system":"紫色系","gender":"female"},
            {"name":"丁香","hex":"#9B5DE5","system":"紫色系","gender":"female"},
            {"name":"菖蒲","hex":"#7209B7","system":"紫色系","gender":"unisex"},
            {"name":"紫水晶","hex":"#560BAD","system":"紫色系","gender":"female"},
            {"name":"兰花","hex":"#F3B7E5","system":"紫色系","gender":"female"},
            {"name":"暗紫罗兰","hex":"#3C0753","system":"紫色系","gender":"male"},
            {"name":"李子色","hex":"#8338EC","system":"紫色系","gender":"female"}
        ],
        "无彩色系": [
            {"name":"贝色","hex":"#F4F1DE","system":"无彩色系","gender":"unisex"},
            {"name":"空五倍子","hex":"#BCA38C","system":"无彩色系","gender":"unisex"},
            {"name":"灰汁","hex":"#9F8C75","system":"无彩色系","gender":"unisex"},
            {"name":"中灰","hex":"#8D99AE","system":"无彩色系","gender":"unisex"},
            {"name":"鸠羽灰","hex":"#6D6875","system":"无彩色系","gender":"unisex"},
            {"name":"青灰","hex":"#4A4E69","system":"无彩色系","gender":"unisex"},
            {"name":"濡雨色","hex":"#22223B","system":"无彩色系","gender":"male"},
            {"name":"消炭色","hex":"#1A1A1D","system":"无彩色系","gender":"male"}
        ]
    };

    let userGender = 'male';
    let userSelection = [];

    // ========== 色彩科学工具 ==========
    function hexToHsl(hex) {
        hex = hex.replace('#', '');
        const r = parseInt(hex.substring(0, 2), 16) / 255;
        const g = parseInt(hex.substring(2, 4), 16) / 255;
        const b = parseInt(hex.substring(4, 6), 16) / 255;

        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;

        if (max === min) {
            h = s = 0;
        } else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
    }

    function findClosestColorByHue(targetHue, excludeNames = []) {
        let bestMatch = null;
        let minDiff = Infinity;

        for (const colors of Object.values(colorData)) {
            for (const color of colors) {
                if (excludeNames.includes(color.name)) continue;
                // 👇 性别过滤
                if (userGender === 'male' && color.gender === 'female') continue;
                if (userGender === 'female' && color.gender === 'male') continue;

                const hsl = hexToHsl(color.hex);
                const diff = Math.min(
                    Math.abs(hsl.h - targetHue),
                    360 - Math.abs(hsl.h - targetHue)
                );
                if (diff < minDiff) {
                    minDiff = diff;
                    bestMatch = color;
                }
            }
        }
        return bestMatch;
    }

    function getMonochromaticPalette(baseColor, count) {
        const baseHsl = hexToHsl(baseColor.hex);
        const candidates = [];

        const sysColors = colorData[baseColor.system] || [];
        for (const c of sysColors) {
            // 👇 性别过滤
            if (userGender === 'male' && c.gender === 'female') continue;
            if (userGender === 'female' && c.gender === 'male') continue;

            const hsl = hexToHsl(c.hex);
            const hueDiff = Math.min(Math.abs(hsl.h - baseHsl.h), 360 - Math.abs(hsl.h - baseHsl.h));
            if (hueDiff <= 15) {
                candidates.push(c);
            }
        }

        candidates.sort((a, b) => hexToHsl(a.hex).l - hexToHsl(b.hex).l);

        if (candidates.length >= count) {
            const step = Math.floor(candidates.length / (count - 1));
            const result = [candidates[0]];
            for (let i = 1; i < count - 1; i++) {
                result.push(candidates[Math.min(i * step, candidates.length - 1)]);
            }
            result.push(candidates[candidates.length - 1]);
            return [...new Set(result)];
        }
        return candidates;
    }

    // ========== 初始化色卡（加固版） ==========
    function init() {
        const container = document.getElementById('color-selection-area');
        if (!container) return;

        let html = '';

        try {
            for (const system in colorData) {
                if (!colorData.hasOwnProperty(system)) continue;
                const colors = colorData[system];
                if (!Array.isArray(colors)) continue;

                html += '<div class="color-system">';
                html += '<span class="system-name">' + system + '</span>';
                html += '<div class="color-grid">';

                for (let i = 0; i < colors.length; i++) {
                    const color = colors[i];
                    if (!color || typeof color.hex !== 'string' || !color.name) continue;
                    html += '<div class="color-chip" ' +
                        'style="background-color:' + color.hex + ';width:70px;height:40px;" ' +
                        'onclick="toggleColor(this,\'' + system + '-' + i + '\')" ' +
                        'data-id="' + system + '-' + i + '" ' +
                        'data-name="' + color.name + '" ' +
                        'data-system="' + system + '" ' +
                        'data-hex="' + color.hex + '">' +
                        '<span class="tooltip">' + color.name + '</span>' +
                        '</div>';
                }

                html += '</div></div>';
            }

            container.innerHTML = html;
        } catch (e) {
            container.innerHTML = '<div style="color:red;padding:20px;">❌ 色卡加载失败</div>';
        }
    }

    function setGender(gender) {
        userGender = gender;
        document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        userSelection = [];
        document.querySelectorAll('.color-chip').forEach(c => c.classList.remove('selected'));
        document.getElementById('results-area').innerHTML = '';
    }

    function toggleColor(element, id) {
        if (userSelection.length >= 2 && !element.classList.contains('selected')) {
            alert("最多只能选择两件衣服的颜色哦！");
            return;
        }

        element.classList.toggle('selected');

        if (element.classList.contains('selected')) {
            const sys = element.getAttribute('data-system');
            const name = element.getAttribute('data-name');
            const hex = element.getAttribute('data-hex');
            userSelection.push({ system: sys, name: name, hex: hex, id: id });
        } else {
            userSelection = userSelection.filter(item => item.id !== id);
        }
    }

    // ========== 专业配色引擎（女士防重复 + 兜底版） ==========
    function generateOutfits() {
        if (userSelection.length === 0) {
            alert("请先选择至少一个颜色！");
            return;
        }

        const resultsArea = document.getElementById('results-area');
        resultsArea.innerHTML = '<div style="text-align:center; padding:20px;">✨ Sharon正在调色...</div>';

        setTimeout(() => {
            resultsArea.innerHTML = '';
            const count = userGender === 'male' ? 3 : 5;
            const totalSlots = userGender === 'male' ? 3 : 4;

            const usedPalettes = new Set();
            const allNeutrals = colorData["无彩色系"];

            for (let i = 0; i < count; i++) {
                let outfit = null;
                let mode = '';
                let explanation = '';

                // ====== 女士第5套：强制兜底方案 ======
                if (userGender === 'female' && i === 4) {
                    const safeNeutrals = [
                        allNeutrals.find(c => c.name === "贝色") || allNeutrals[0],
                        allNeutrals.find(c => c.name === "中灰") || allNeutrals[1],
                        allNeutrals.find(c => c.name === "鸠羽灰") || allNeutrals[2]
                    ].filter(Boolean);

                    outfit = [...userSelection];
                    for (const n of safeNeutrals) {
                        if (!outfit.find(c => c.name === n.name)) {
                            outfit.push(n);
                        }
                    }
                    outfit = outfit.slice(0, totalSlots);
                    mode = "经典不出错";
                    explanation = "采用**万能无彩色搭配法则**：用户主色 + 贝色（提亮）+ 中灰（过渡）+ 鸠羽灰（稳重），适合任何场合，永不出错。";

                    const paletteKey = outfit.map(c => c.name).sort().join(',');
                    usedPalettes.add(paletteKey);

                } else {
                    let attempts = 0;
                    const maxAttempts = 10;

                    while (attempts < maxAttempts) {
                        attempts++;
                        let candidate = [...userSelection];

                        if (i === 0) {
                            mode = "经典同色";
                            const mono = getMonochromaticPalette(userSelection[0], totalSlots);
                            candidate = [...new Set([...candidate, ...mono])].slice(0, totalSlots);
                            explanation = "采用**同色系明度渐变**，通过深浅变化营造高级层次感，永不出错的经典法则。";

                        } else if (i === 1) {
                            mode = "邻近和谐";
                            const base = userSelection[0];
                            const baseHsl = hexToHsl(base.hex);
                            const hues = [
                                (baseHsl.h - 30 + 360) % 360,
                                baseHsl.h,
                                (baseHsl.h + 30) % 360
                            ];
                            const picks = hues.map(h => findClosestColorByHue(h, candidate.map(c => c.name)));
                            candidate = [...new Set([...candidate, ...picks.filter(Boolean)])].slice(0, totalSlots);
                            explanation = "运用**邻近色和谐原理**（色相环±30°），色彩过渡自然柔和，适合日常通勤与温柔风格。";

                        } else {
                            mode = (i % 2 === 0) ? "互补撞色" : "分裂互补";
                            const base = userSelection[0];
                            const baseHsl = hexToHsl(base.hex);
                            let hues = [];

                            if (mode === "互补撞色") {
                                hues = [(baseHsl.h + 180) % 360];
                            } else {
                                hues = [(baseHsl.h + 150) % 360, (baseHsl.h + 210) % 360];
                            }

                            const picks = hues.map(h => findClosestColorByHue(h, candidate.map(c => c.name)));
                            candidate = [...new Set([...candidate, ...picks.filter(Boolean)])].slice(0, totalSlots);

                            explanation = mode === "互补撞色" 
                                ? "大胆使用**互补色对冲**（色相环180°对立），视觉张力十足，适合打造焦点造型。"
                                : "采用**分裂互补配色**，在保留对比度的同时降低冲突感，比纯互补更易驾驭。";
                        }

                        while (candidate.length < totalSlots) {
                            const neutrals = allNeutrals.filter(c => !candidate.find(oc => oc.name === c.name));
                            if (neutrals.length > 0) {
                                candidate.push(neutrals[0]);
                            } else break;
                        }

                        const finalCandidate = [...userSelection];
                        for (const c of candidate) {
                            if (!finalCandidate.find(fc => fc.name === c.name)) {
                                finalCandidate.push(c);
                            }
                        }
                        const trimmed = finalCandidate.slice(0, totalSlots);

                        const paletteKey = trimmed.map(c => c.name).sort().join(',');
                        if (!usedPalettes.has(paletteKey)) {
                            usedPalettes.add(paletteKey);
                            outfit = trimmed;
                            break;
                        }
                    }

                    if (!outfit) {
                        outfit = [...userSelection];
                        const neutrals = allNeutrals.filter(n => !outfit.find(c => c.name === n.name));
                        while (outfit.length < totalSlots && neutrals.length > 0) {
                            outfit.push(neutrals.shift());
                        }
                        outfit = outfit.slice(0, totalSlots);
                        mode = "智能补全";
                        explanation = "系统为你补全的协调方案，确保完整性。";
                    }
                }

                const scenario = getScenario(userGender, i);
                const copyText = generateCopyText(outfit, scenario, i + 1, mode, explanation);

                const card = document.createElement('div');
                card.className = 'card result-card';
                card.innerHTML = `
                    <div class="result-header">
                        <span class="result-tag">${mode} · 方案 ${i + 1}</span>
                        <span class="scene-tag">${scenario.season} · ${scenario.scene}</span>
                    </div>
                    <div class="palette-strip">
                        ${outfit.map((color, idx) => {
                            let role = idx < userSelection.length ? "用户所选" : (idx === userSelection.length ? "主色调" : "点缀色");
                            let style = idx < userSelection.length ? "border: 2px solid #333;" : "";
                            return `
                                <div class="palette-item">
                                    <div class="palette-color" style="background:${color.hex}; ${style}"></div>
                                    <span class="palette-label">${color.name}</span>
                                    <span class="palette-role">${role}</span>
                                </div>`;
                        }).join('')}
                    </div>
                    <button class="copy-btn" onclick="copyToClipboard(this, '${encodeURIComponent(copyText)}')">
                        📋 复制小红书文案
                    </button>
                `;
                resultsArea.appendChild(card);
            }
        }, 800);
    }

    // ========== 辅助函数 ==========
    function getScenario(gender, index) {
        const maleScenes = [
            { season: "秋冬", scene: "都市通勤" },
            { season: "春夏", scene: "周末休闲" },
            { season: "深冬", scene: "商务会议" }
        ];
        const femaleScenes = [
            { season: "早春", scene: "约会下午茶" },
            { season: "盛夏", scene: "海边度假" },
            { season: "晚秋", scene: "艺术看展" },
            { season: "初冬", scene: "圣诞派对" },
            { season: "四季", scene: "日常OOTD" }
        ];
        return gender === 'male' ? maleScenes[index % 3] : femaleScenes[index % 5];
    }

    function generateCopyText(colors, scenario, num, mode, explanation) {
        const colorTags = colors.map(c => `#${c.name}`).join(' ');
        const userColors = colors.slice(0, userSelection.length).map(c => c.name).join(' + ');

        return `
#Sharon万花筒 #专业配色 #色彩理论
✨ Sharon万花筒方案 No.${num} | ${mode}

🎨 **配色公式**
${userColors}（你的灵感）+ ${colors.slice(userSelection.length).map(c => c.name).join(' + ')}

💡 **专业解析**
${explanation}

👗 **场景适配**：${scenario.scene}  
📅 **季节建议**：${scenario.season}

🏷️ **关键词**：${colorTags} #OOTD #高级感穿搭

> Sharon提示：此方案基于**国际标准色相环**计算生成，非随机搭配，可放心参考！
        `.trim();
    }

    function copyToClipboard(btn, text) {
        const decodedText = decodeURIComponent(text);
        navigator.clipboard.writeText(decodedText).then(() => {
            const toast = document.getElementById('guide-toast');
            toast.style.display = 'flex';
            
            const openBtn = document.getElementById('open-xhs-btn');
            if (!openBtn.hasListener) {
                openBtn.addEventListener('click', () => {
                    window.location.href = 'xhsdiscover://'; 
                    setTimeout(() => {
                        if (document.hidden || document.visibilityState === 'hidden') return;
                        window.open('https://www.xiaohongshu.com', '_blank');
                    }, 2000);
                });
                openBtn.hasListener = true;
            }

            setTimeout(() => {
                toast.style.display = 'none';
            }, 5000);
        }).catch(err => {
            alert('复制失败，请手动长按选择“复制”');
        });
    }

    // 启动
    init();
</script>
